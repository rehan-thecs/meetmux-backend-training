<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MeetMux Socket Test</title>

    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      button {
        padding: 10px 20px;
        margin-right: 10px;
        cursor: pointer;
      }

      #logs {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ccc;
        min-height: 200px;
        background: #f5f5f5;
      }

      .log {
        margin-bottom: 10px;
        color: #222;
      }
    </style>
  </head>

  <body>
    <h1>MeetMux Real-Time Test</h1>

    <button onclick="joinActivity()">Join Activity</button>

    <button onclick="joinRoom()">Join Event Room</button>

    <div id="logs"></div>

    <!-- Socket.io Client -->

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>
      /*
    |--------------------------------------------------------------------------
    | Connect Socket
    |--------------------------------------------------------------------------
    */

      const socket = io("http://localhost:3000");

      const logs = document.getElementById("logs");

      /*
    |--------------------------------------------------------------------------
    | Add Log To Screen
    |--------------------------------------------------------------------------
    */

      function addLog(message) {
        const div = document.createElement("div");

        div.className = "log";

        div.innerText = message;

        logs.appendChild(div);
      }

      /*
    |--------------------------------------------------------------------------
    | Connected
    |--------------------------------------------------------------------------
    */

      socket.on("connect", () => {
        addLog(`Connected To Server: ${socket.id}`);

        console.log("Connected:", socket.id);
      });

      /*
    |--------------------------------------------------------------------------
    | Listen For Broadcast
    |--------------------------------------------------------------------------
    */

      socket.on("new_participant", (data) => {
        addLog(`Broadcast: ${data.message}`);

        console.log(data);
      });

      /*
    |--------------------------------------------------------------------------
    | Listen For Room Notification
    |--------------------------------------------------------------------------
    */

      socket.on("notification", (message) => {
        addLog(`Room Notification: ${message}`);

        console.log(message);
      });

      /*
    |--------------------------------------------------------------------------
    | Join Activity
    |--------------------------------------------------------------------------
    */

      function joinActivity() {
        socket.emit("join_activity", {
          activityName: "Chess Club",
        });

        addLog("You joined Chess Club");
      }

      /*
    |--------------------------------------------------------------------------
    | Join Room
    |--------------------------------------------------------------------------
    */

      function joinRoom() {
        socket.emit("subscribe_to_event", "event-101");

        addLog("Subscribed to Event Room event-101");
      }
    </script>
  </body>
</html>
